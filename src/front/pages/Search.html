<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jake - Todo lo que buscabas</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fbfbfb; /* Ligeramente gris para que resalte la barra de búsqueda blanca */
        }
        
        .fw-bold { font-weight: 700 !important; }
        .fw-semibold { font-weight: 600 !important; }
        
        /* Estilo para el logo circular */
        .brand-logo {
            width: 36px;
            height: 36px;
            background-color: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* Estilos específicos para la barra de búsqueda */
        .search-container {
            max-width: 850px;
            margin: 0 auto;
        }
        
        .search-input:focus {
            box-shadow: none;
            background-color: transparent;
        }
        
        /* Efecto hover sutil para las tarjetas de categorías */
        .category-card {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }

        /* Verde vibrante para el botón de servicios (basado en la imagen) */
        .btn-green {
            background-color: #12b726;
            color: white;
            border-color: #12b726;
        }
        .btn-green:hover {
            background-color: #0e9a1f;
            color: white;
            border-color: #0e9a1f;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3">
        <div class="container-fluid px-4 px-lg-5">
            <!-- Brand -->
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <div class="brand-logo rounded-circle fw-bold">JK</div>
                <span class="fw-bold fs-5 text-dark">Jake</span>
            </a>

            <!-- Mobile Toggle -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Links & Buttons -->
            <div class="collapse navbar-collapse" id="navbarContent">
                <div class="ms-auto d-flex flex-column flex-lg-row align-items-lg-center gap-3 mt-3 mt-lg-0">
                    <a href="#" class="btn btn-outline-primary rounded-pill fw-semibold px-3 py-2" style="font-size: 14px;">
                        Ofrecer servicios
                    </a>
                    <a href="#" class="text-secondary d-none d-lg-block">
                        <i class="bi bi-globe fs-5"></i>
                    </a>
                    <a href="#" class="btn btn-outline-secondary rounded-pill fw-semibold px-4 py-2 d-flex align-items-center justify-content-center gap-2 text-dark border-light-subtle" style="font-size: 14px;">
                        <i class="bi bi-person fs-5"></i> Acceder
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container px-4 px-lg-5 mt-5 pt-4">
        
        <!-- Hero Section -->
        <header class="text-center mb-5">
            <h1 class="fw-bold text-dark mb-3" style="font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -1px;">
                Todo lo que buscabas, en un solo sitio
            </h1>
            <p class="text-secondary mx-auto" style="max-width: 700px; font-size: 1.1rem;">
                ¿Necesitas ayuda? Con <span class="fw-bold text-dark">Jake</span> puedes solucionarlo rápido y fácil: desde limpieza, reparaciones y mucho más.
            </p>
        </header>

        <!-- Search Bar -->
        <section class="search-container mb-5">
            <!-- En móvil tiene esquinas algo redondeadas, en escritorio es estilo píldora -->
            <div class="bg-white rounded-4 rounded-md-pill shadow-sm p-2 d-flex flex-column flex-md-row align-items-center">
                
                <!-- Input Servicio -->
                <div class="flex-grow-1 w-100 position-relative py-2 py-md-0 px-3">
                    <input type="text" class="form-control border-0 search-input bg-transparent text-center text-md-start" placeholder="¿Qué servicio estás buscando?">
                </div>
                
                <!-- Separador (visible solo en escritorio) -->
                <div class="d-none d-md-block border-end py-3" style="border-color: #eaeaea !important;"></div>
                
                <!-- Separador (visible solo en móvil) -->
                <hr class="d-md-none w-100 my-1 text-light">

                <!-- Input Ciudad -->
                <div class="flex-grow-1 w-100 position-relative py-2 py-md-0 px-3">
                    <input type="text" class="form-control border-0 search-input bg-transparent text-center text-md-start" placeholder="Ciudad">
                </div>

                <!-- Botón Buscar -->
                <div class="w-100 text-end px-2" style="max-width: fit-content;">
                    <button class="btn btn-primary rounded-pill w-100 px-4 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                </div>
            </div>
        </section>

        <!-- Action Buttons -->
        <section class="d-flex flex-column flex-sm-row justify-content-center align-items-center gap-3 mb-5 pb-4">
            <a href="#" class="btn btn-outline-primary rounded-pill px-4 py-2 fw-semibold w-100" style="max-width: 250px;">
                Unirme como proveedor
            </a>
            <a href="#" class="btn btn-green rounded-pill px-4 py-2 fw-semibold w-100" style="max-width: 250px;">
                Ver todos los servicios <i class="bi bi-chevron-right ms-1" style="font-size: 0.8em;"></i>
            </a>
        </section>

        <!-- Categories Section -->
        <section class="text-center mt-4 mb-5 pb-5">
            <h3 class="fw-bold mb-4">Nuestras categorías</h3>
            
            <div class="row justify-content-center g-3 g-md-4 max-w-4xl mx-auto" style="max-width: 800px;">
                <!-- Category 1 -->
                <div class="col-6 col-md-3">
                    <div class="card category-card bg-white border border-light-subtle rounded-3 h-100 py-4 shadow-sm">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center p-2">
                            <i class="bi bi-house fs-1 text-dark mb-2"></i>
                            <h6 class="fw-semibold text-dark mb-0 fs-6">Reparaciones</h6>
                        </div>
                    </div>
                </div>

                <!-- Category 2 -->
                <div class="col-6 col-md-3">
                    <div class="card category-card bg-white border border-light-subtle rounded-3 h-100 py-4 shadow-sm">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center p-2">
                            <i class="bi bi-house fs-1 text-dark mb-2"></i>
                            <h6 class="fw-semibold text-dark mb-0 fs-6">Belleza</h6>
                        </div>
                    </div>
                </div>

                <!-- Category 3 -->
                <div class="col-6 col-md-3">
                    <div class="card category-card bg-white border border-light-subtle rounded-3 h-100 py-4 shadow-sm">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center p-2">
                            <i class="bi bi-house fs-1 text-dark mb-2"></i>
                            <h6 class="fw-semibold text-dark mb-0 fs-6">Clases</h6>
                        </div>
                    </div>
                </div>

                <!-- Category 4 -->
                <div class="col-6 col-md-3">
                    <div class="card category-card bg-white border border-light-subtle rounded-3 h-100 py-4 shadow-sm">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center p-2">
                            <i class="bi bi-house fs-1 text-dark mb-2"></i>
                            <h6 class="fw-semibold text-dark mb-0 fs-6">Cuidados</h6>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
